# App 打包設定（npm run dist:mac／npm run dist:win）。只給自己這台用：不簽章、只產生資料夾（dir）、不設開機自動啟動。
# 模型不打包：App 從自己的位置往上找專案的 models/（electron/species.ts）。
# 2026-11-17 開源前改成不帶個人名字的識別碼（原本是 dev.<本名>.pokemon-ranch-pets）；scripts/pet-app.mjs 的 BUNDLE_ID 要一起改
appId: io.github.rex-shark.pokemon-ranch-pets
productName: Pokemon Ranch Pets
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
# 系統匣（Windows）與開發模式用的精靈球 PNG：放到 resources/icon.png（electron/main.ts 的 ICON_PNG）
extraResources:
  - from: build/icon.png
    to: icon.png
mac:
  target:
    - target: dir
  identity: null
  category: public.app-category.utilities
  # Dock 圖示：精靈球（scripts/draw-icon.swift 畫 build/icon.png，再用 iconutil 轉成 icns）
  icon: build/icon.icns
win:
  # 輸出 release/win-unpacked/Pokemon Ranch Pets.exe（scripts/pet-app.mjs 開這個）；不做安裝程式
  target:
    - target: dir
  # 1024×1024 的 PNG，electron-builder 會自己轉成 .ico（沒有憑證就不簽章，只把圖示寫進 exe）
  icon: build/icon.png
